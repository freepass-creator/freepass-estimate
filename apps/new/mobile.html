<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>프리패스모빌리티 · 신차 장기렌터카 견적</title>
  <meta name="theme-color" content="#1b2a4a" />
  <meta name="description" content="프리패스모빌리티 신차 장기렌터카 견적 화면" />
  <!-- Open Graph (카톡/페북/슬랙 등 링크 미리보기) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="프리패스모빌리티 · 신차 장기렌터카 견적" />
  <meta property="og:description" content="프리패스모빌리티 신차 장기렌터카 견적 화면" />
  <meta property="og:site_name" content="프리패스모빌리티" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- PWA — 홈 화면에 추가 (앱처럼 설치) -->
  <link rel="manifest" href="/freepass-manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="프리패스 견적" />
  <script>
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/admin-alignment.css" />
  <!-- 차량 DB — PC 와 동일 SSOT -->
  <!-- 차량 선택용으로 이관된 레거시 DB 파일. 파일명은 호환을 위해 유지하며 제품 브랜드를 뜻하지 않는다. -->
  <script src="/welrix-db.js"></script>
  <!-- 견적서 이미지 캡쳐용 -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- 견적서(official) CSS — PC 와 동일 스타일 (이미지 캡쳐 시 적용) -->
  <link rel="stylesheet" href="/quote-doc.css" />
  <style>
    :root {
      /* 모바일에서만 필요한 safe-area. 색/폰트/라운드/높이는 tokens.css 한 곳이 정본이다. */
      --safe-top: env(safe-area-inset-top, 0);
      --safe-bottom: env(safe-area-inset-bottom, 0);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--ink-1);
      font-family: var(--font);
      font-size: var(--fs-base);
      line-height: 1.5;
      letter-spacing: -0.2px;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
      /* 화면을 당겼다 놓을 때 브라우저 '당겨서 새로고침'으로 견적 데이터가 날아가는 것 방지 */
      overscroll-behavior-y: contain;
    }
    /* 1024px 초과 (PC) 진입 시 데스크탑으로 리다이렉트 — 모바일 페이지인데 PC 로 들어오면 어색
       ★?force=mobile 이면 넘기지 않으므로 이 안내도 띄우지 않는다(html.force-mobile).
         예전엔 넘기기는 멈추고 이 안내만 떠서, PC 로 연 손님 링크가 「PC 버전으로 이동합니다」에 멈춰 있었다. */
    @media (min-width: 1025px) {
      html:not(.force-mobile) body::before {
        content: '데스크탑 환경입니다 — PC 버전으로 이동합니다';
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--ink-3); font-size: 14px;
      }
    }
    #m-app { min-height: 100vh; display: flex; flex-direction: column; }

    /* 폰보다 넓은 화면(태블릿·PC) — 견적기를 폰 폭 기둥으로 가운데 모은다.
       고정된 줄(헤더·진행바·금액바·아래 버튼)은 left:0; right:0 이라 max-width + margin:auto 로 가운데 온다.
       html 을 앞에 붙인 건 컴포넌트 scoped 스타일보다 세게 먹이려는 것이다. */
    @media (min-width: 561px) {
      html body { background: #f1f2f4; }
      html #m-app, html .m-header, html .m-progress, html .m-footer, html .sq {
        max-width: 480px; margin-left: auto; margin-right: auto;
      }
      html #m-app {
        background: var(--bg);
        box-shadow: 0 0 0 1px rgba(0,0,0,.035), 0 12px 40px rgba(0,0,0,.035);
      }
    }
    @media (min-width: 900px) {
      /* PC에서 손님 링크를 열어도 모바일 흐름은 유지하되, 폰보다 조금 넓게 읽힌다. */
      html #m-app, html .m-header, html .m-progress, html .m-footer, html .sq {
        max-width: 540px;
      }
    }

    /* 진입 게이트 */
    .gate-bg {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #f7f7f7, #eef4fa);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .gate-card {
      width: 100%; max-width: 360px;
      background: #fff;
      border-radius: 16px;
      padding: 36px 28px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      text-align: center;
    }
    .gate-ci { height: 24px; width: auto; margin-bottom: 20px; }
    .gate-title { font-size: 18px; font-weight: 700; color: var(--ink-1); margin: 0 0 6px; letter-spacing: -0.3px; }
    .gate-sub { font-size: 13px; color: var(--ink-3); margin: 0 0 22px; }
    #gate-pin {
      width: 100%; height: 50px;
      padding: 0 16px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-family: inherit; font-size: 22px;
      text-align: center; letter-spacing: 12px;
      color: var(--ink-1); outline: none;
      font-variant-numeric: tabular-nums;
      transition: border-color .12s;
    }
    #gate-pin:focus { border-color: var(--brand); }
    #gate-err {
      margin-top: 10px; padding: 8px 12px;
      background: #fff1f1; color: #c62828;
      border-radius: 6px; font-size: 12.5px;
    }
    #gate-submit {
      width: 100%; height: 50px; margin-top: 14px;
      background: var(--brand); color: #fff;
      border: 0; border-radius: 10px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    #gate-submit:active { background: var(--brand-700); }
    #gate-admin {
      width: 100%; height: 38px; margin-top: 8px;
      background: transparent; color: var(--ink-3);
      border: 0; border-radius: 8px;
      font-family: inherit; font-size: 12.5px; font-weight: 500;
      cursor: pointer;
    }
    #gate-admin:active { background: var(--bg-soft); color: var(--ink-1); }
  </style>
  <script>
    // PC viewport 로 들어오면 데스크탑 페이지로 redirect (단, ?force=mobile 이면 유지)
    (function () {
      const params = new URLSearchParams(location.search);
      if (params.get('force') === 'mobile') { document.documentElement.classList.add('force-mobile'); return; }
      if (window.innerWidth > 1024) {
        const target = location.pathname.replace(/mobile\.html$/, 'index.html');
        location.replace(target + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
<!-- ★역할은 src/lib/role.js 가 정한다. 기본은 «손님».
     예전엔 여기서 sessionStorage 에 'agent' 를 박아 «늘 담당자»로 열었는데,
     그 값을 읽는 데가 한 군데도 없어 껍데기였다. 걷어냈다. -->
  <div id="m-app"></div>
  <script type="module" src="/src/mobile.js"></script>
</body>
</html>
