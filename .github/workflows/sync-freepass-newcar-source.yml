name: Sync FreePass new-car source

on:
  push:
    branches:
      - work/ui-baseline
    paths:
      - '.github/workflows/sync-freepass-newcar-source.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Estimate
        uses: actions/checkout@v4
        with:
          ref: work/ui-baseline
          fetch-depth: 0
      - name: Checkout ERP new-car SSOT artifacts
        uses: actions/checkout@v4
        with:
          repository: freepass-creator/freepasserp4
          ref: main
          path: .erp-reference
          persist-credentials: false
      - name: Checkout Welrix provider reference
        uses: actions/checkout@v4
        with:
          repository: freepass-creator/welrixtable
          ref: main
          path: .welrix-reference
          persist-credentials: false
      - name: Copy public new-car source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/new/public/data/freepass-newcar
          cp .erp-reference/data/new-car/current-feed.snapshot.json apps/new/public/data/freepass-newcar/current-feed.snapshot.json
          cp .erp-reference/data/model-aliases.json apps/new/public/data/freepass-newcar/model-aliases.json
          cp .erp-reference/data/new-car/welrix-id-map.json apps/new/public/data/freepass-newcar/welrix-id-map.json
          cp .erp-reference/data/new-car/hk-config.json apps/new/public/data/freepass-newcar/hk-config.json
          cp .erp-reference/data/new-car/genesis-config-fs.json apps/new/public/data/freepass-newcar/genesis-config-fs.json
          cp .erp-reference/data/new-car/domestic-minor.json apps/new/public/data/freepass-newcar/domestic-minor.json
          cp .erp-reference/public/data/vehicle-trim-master.json apps/new/public/data/freepass-newcar/vehicle-trim-master.json
          mkdir -p apps/new/api/_standard/data
          cp .erp-reference/data/new-car/standard-quote-defaults.snapshot.json apps/new/api/_standard/standard-quote-defaults.snapshot.json
          cp .erp-reference/lib/domain/estimate/calc.js apps/new/api/_standard/calc.js
          cp .erp-reference/lib/domain/estimate/turnover-cost.js apps/new/api/_standard/turnover-cost.js
          cp .erp-reference/lib/domain/estimate/data/cost-config.js apps/new/api/_standard/data/cost-config.js
          cp .erp-reference/lib/domain/estimate/data/residual-delta.json apps/new/api/_standard/data/residual-delta.json
      - name: Rebuild UI DB from synchronized SSOT
        working-directory: apps/new
        env:
          WELRIX_DB_PATH: ../../.welrix-reference/public/welrix-db.js
        run: |
          node scripts/build-freepass-vehicle-db.mjs
          node scripts/build-readiness-gaps.mjs
          node --check public/vehicle-db.js
          node --check public/welrix-db.js
      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "freepass-estimate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/new/public/data/freepass-newcar apps/new/public/vehicle-db.js apps/new/public/welrix-db.js apps/new/api/_standard
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(new): sync FreePass new-car SSOT artifacts"
          git push origin HEAD:work/ui-baseline
