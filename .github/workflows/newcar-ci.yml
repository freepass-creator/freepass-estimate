name: FreePass Estimate UI + engine CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/ui-ux/**'
      - 'work/feature/**'
      - 'work/engine/**'
      - 'work/integration/**'
    paths:
      - 'apps/new/**'
      - '.github/workflows/newcar-ci.yml'
  pull_request:
    paths:
      - 'apps/new/**'
      - '.github/workflows/newcar-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pricing-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/new/package-lock.json
      - name: Install
        run: npm ci
      - name: Authoritative pricing syntax
        run: |
          node --check api/freepass-data-master.js
          node --check api/_master/authoritative-request.js
          node --check api/standard-quote.js
          node --check api/external-quote.js
          node --check src/lib/quote/build-request.js
          node --check src/lib/quote/provider-policy.js
      - name: Estimate/Data authority boundary
        run: npm run check:authority-boundary
      - name: FreePass Data price authority
        run: npm run check:pricing
      - name: External provider routing
        run: node scripts/test-provider-routing.mjs
      - name: External provider failure policy
        run: npm run check:provider-policy
      - name: Standard pricing regression
        run: node scripts/check-standard-engine.mjs
      - name: Quote execution carries canonical PriceBasis
        run: npm run check:runtime
      - name: Quote issuance binds PriceBasis to master snapshot
        run: node scripts/check-quote-factory.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/new/package-lock.json
      - name: Install
        run: npm ci
      - name: FreePass Estimate UI structure guard
        run: node scripts/check-ui-parity.mjs
      - name: Syntax check provider files
        run: |
          node --check src/lib/quote/contracts.js
          node --check scripts/check-verification-manifest.mjs
          node --check src/lib/quote/provider-config.js
          node --check src/lib/quote/calculate.js
          node --check src/lib/quote/execution-result.js
          node --check src/lib/quote/core-contract-shadow.js
          node --check scripts/check-ai-core-contract-shadow.mjs
          node --check src/lib/quote/build-request.js
          node --check src/lib/quote/quote-v2.js
          node --check src/lib/quote/from-calculation.js
          node --check src/lib/quote/master-context.js
          node --check src/lib/quote/master-selection.js
          node --check src/lib/quote/quote-repository.js
          node --check src/lib/quote/pricing-engine.js
          node --check src/lib/quote/price-basis.js
          node --check src/lib/quote/repositories/freepass-data.js
          node --check src/lib/master/freepass-data-master.js
          node --check api/freepass-data-master.js
          node --check api/_master/authoritative-request.js
          node --check src/lib/quote/engines/freepass-standard.js
          node --check src/lib/quote/engines/external.js
          node --check src/lib/quote/provider-policy.js
          node --check scripts/check-provider-runtime-policy.mjs
          node --check src/lib/share-link.js
          node --check api/external-quote.js
          node --check api/standard-quote.js
          node --check api/version.js
          node --check api/_standard/standard-service.js
          node --check api/_standard/calc.js
          node --check quote.js
      # package.json owns the U/F/E verification list. Do not copy a subset here:
      # that previously omitted feature, model-year, preview and convergence tests.
      - name: Canonical UFE verification and production build
        run: npm run verify
      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: newcar-preview-dist
          path: apps/new/dist
          retention-days: 3
          if-no-files-found: error

  visual-audit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/new/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install browser audit dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/freepass-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mobile.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/freepass-vite.log
          exit 1
      - name: Rendered UI visual audit
        env:
          BASE_URL: http://127.0.0.1:5173
          ARTIFACT_DIR: artifacts/ui-visual-audit
        run: node scripts/e2e-ui-visual-audit.mjs
      - name: Upload UI visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-audit
          path: apps/new/artifacts/ui-visual-audit
          retention-days: 3
          if-no-files-found: warn
