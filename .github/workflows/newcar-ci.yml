name: New-car baseline CI

on:
  push:
    branches:
      - work/ui-baseline
    paths:
      - 'apps/new/**'
      - '.github/workflows/newcar-ci.yml'
  pull_request:
    paths:
      - 'apps/new/**'
      - '.github/workflows/newcar-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/new
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Welrix UI reference
        uses: actions/checkout@v4
        with:
          repository: freepass-creator/welrixtable
          ref: 707a57f8f97aed28eaab7f1fa7e42cd0bff9ee2d
          path: .ui-reference
          persist-credentials: false
      - name: UI parity — visible structure/style must match pinned Welrix
        working-directory: apps/new
        run: node scripts/check-ui-parity.mjs
      - name: Action placement standard
        working-directory: apps/new
        run: node scripts/check-action-placement.mjs
      - name: Mobile navigation contract
        working-directory: apps/new
        run: node scripts/check-mobile-navigation-contract.mjs
      - name: FreePass visual grammar
        working-directory: apps/new
        run: node scripts/check-freepass-visual-grammar.mjs
      - name: Accessibility baseline
        working-directory: apps/new
        run: node scripts/check-accessibility-baseline.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/new/package-lock.json
      - name: Install
        run: npm ci
      - name: Syntax check provider files
        run: |
          node --check src/lib/quote/provider-config.js
          node --check src/lib/quote/calculate.js
          node --check src/lib/quote/execution-result.js
          node --check src/lib/quote/build-request.js
          node --check src/lib/quote/engines/freepass-standard.js
          node --check src/lib/quote/engines/external.js
          node --check api/external-quote.js
          node --check api/standard-quote.js
          node --check api/version.js
          node --check api/_standard/standard-service.js
          node --check api/_standard/calc.js
          node --check quote.js
      - name: Representative vehicle configuration
        run: node scripts/check-newcar-configurations.mjs
      - name: Standard engine regression
        run: node scripts/check-standard-engine.mjs
      - name: Provider contract
        run: npm run check:provider
      - name: Provider routing
        run: node scripts/test-provider-routing.mjs
      - name: Quote runtime proof contract
        run: npm run check:runtime
      - name: Release revision proof contract
        run: npm run check:release
      - name: Existing sync checks
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: newcar-preview-dist
          path: apps/new/dist
          retention-days: 3
          if-no-files-found: error
