name: New-car master audit

on:
  push:
    branches:
      - work/ui-baseline
    paths:
      - 'apps/new/scripts/audit-newcar-master.mjs'
      - '.github/workflows/newcar-master-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout FreePass Estimate
        uses: actions/checkout@v4
      - name: Checkout current ERP trim master
        uses: actions/checkout@v4
        with:
          repository: freepass-creator/freepasserp4
          ref: main
          path: .master-reference
          persist-credentials: false
      - name: Checkout current Welrix reference data
        uses: actions/checkout@v4
        with:
          repository: freepass-creator/welrixtable
          ref: main
          path: .welrix-reference
          persist-credentials: false
      - name: Audit new-car master and option relations
        working-directory: apps/new
        run: node scripts/audit-newcar-master.mjs
        continue-on-error: true
