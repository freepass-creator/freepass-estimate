name: Audit unresolved engine source facts
on:
  push:
    branches: [main, 'integration/**']
    paths:
      - 'apps/new/scripts/audit-gap-source-fields.mjs'
      - '.github/workflows/audit-gap-source-fields.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/new
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit-gap-source-fields.mjs
