name: Build FreePass new-car maps

on:
  push:
    branches: [work/ui-baseline]
    paths:
      - 'apps/new/scripts/build-product-canonical-map.mjs'
      - 'apps/new/scripts/build-provider-welrix-map.mjs'
      - '.github/workflows/build-freepass-newcar-maps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/new
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ui-baseline
          fetch-depth: 0
      - name: Canonical identity map
        run: node scripts/build-product-canonical-map.mjs
      - name: Welrix provider capability map
        run: node scripts/build-provider-welrix-map.mjs
      - name: Commit maps
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "freepass-estimate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/new/public/data/freepass-newcar/product-canonical-map.json apps/new/public/data/freepass-newcar/provider-welrix-map.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(new): build product identity and provider maps [skip ci]"
          git push origin HEAD:work/ui-baseline
