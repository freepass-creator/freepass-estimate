name: New-car standard coverage
on:
  push:
    branches: [main, 'integration/**']
    paths:
      - 'apps/new/scripts/audit-standard-coverage.mjs'
      - 'apps/new/api/_standard/**'
      - 'apps/new/public/vehicle-db.js'
      - '.github/workflows/newcar-standard-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/new
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit-standard-coverage.mjs
