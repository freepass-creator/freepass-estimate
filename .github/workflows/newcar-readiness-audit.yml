name: New-car readiness audit
on:
  push:
    branches: [work/ui-baseline]
    paths:
      - 'apps/new/public/data/freepass-newcar/**'
      - 'apps/new/public/vehicle-db.js'
      - 'apps/new/scripts/audit-newcar-readiness.mjs'
      - '.github/workflows/newcar-readiness-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/new
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit-newcar-readiness.mjs
