name: Audit remaining master gaps
on:
  push:
    branches: [work/ui-baseline]
    paths:
      - 'apps/new/scripts/audit-master-gaps.mjs'
      - '.github/workflows/audit-master-gaps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/new
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit-master-gaps.mjs
